[project]
name = "financial-support-assistant"
version = "0.1.0"
description = "Local banking intent classification, policy retrieval, and drafting."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]
training = ["scikit-learn==1.9.1", "threadpoolctl==3.7.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
